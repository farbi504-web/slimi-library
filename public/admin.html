<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة تحكم مكتبة سليمي</title>
<link rel="icon" type="image/png" href="/brand/mark.png"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Montserrat:wght@600;700;800&family=Tajawal:wght@500;700;800&display=swap">
<style id="css">
/* Concept: liquid-glass storefront. A blurred night photo of the real shopfront glows behind frosted panels; brand yellow, sapphire and sign-red drift as ambient light. Floating glass nav, iOS-style tab bar on phones. */
:root{
  --bg:#ECEFF6;--ink:#0B1426;--muted:#56607A;
  --glass:rgba(255,255,255,.58);--glass-hi:rgba(255,255,255,.86);--field:rgba(255,255,255,.72);
  --edge:rgba(255,255,255,.9);--edge-lo:rgba(20,35,90,.10);--spec-a:rgba(255,255,255,.55);--spec-b:rgba(255,255,255,.22);
  --shadow:0 18px 44px -18px rgba(20,35,90,.38);
  --yellow:#E8A92B;--blue:#173A8A;--red:#FF3B4E;--accent-ink:#0B1F4B;--link:#173A8A;
  --ok:#17794A;--warn:#8F5600;--danger:#B42318;
  --c-school:#2F5BFF;--c-office:#0E8A7D;--c-apps:#E5303F;--c-games:#7A3FE0;--c-services:#C97A00;
  --blob1:rgba(255,199,44,.55);--blob2:rgba(76,110,255,.42);--blob3:rgba(255,59,78,.26);
  --scrim:rgba(10,16,34,.35);
  --font-display:'Rubik','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic','Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070C18;--ink:#EEF2FB;--muted:#9AA6C3;
  --glass:rgba(26,35,64,.52);--glass-hi:rgba(24,32,58,.9);--field:rgba(255,255,255,.07);
  --edge:rgba(255,255,255,.22);--edge-lo:rgba(0,0,0,.45);--spec-a:rgba(255,255,255,.14);--spec-b:rgba(255,255,255,.05);
  --shadow:0 18px 44px -18px rgba(0,0,0,.8);--link:#8EA8FF;
  --ok:#4FC28A;--warn:#F0B14A;--danger:#FF8A80;
  --c-school:#7C9BFF;--c-office:#3CCDB9;--c-apps:#FF7A6E;--c-games:#B28CFF;--c-services:#F0B14A;
  --blob1:rgba(255,199,44,.20);--blob2:rgba(60,90,255,.38);--blob3:rgba(255,59,78,.22);--scrim:rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070C18;--ink:#EEF2FB;--muted:#9AA6C3;
  --glass:rgba(26,35,64,.52);--glass-hi:rgba(24,32,58,.9);--field:rgba(255,255,255,.07);
  --edge:rgba(255,255,255,.22);--edge-lo:rgba(0,0,0,.45);--spec-a:rgba(255,255,255,.14);--spec-b:rgba(255,255,255,.05);
  --shadow:0 18px 44px -18px rgba(0,0,0,.8);--link:#8EA8FF;
  --ok:#4FC28A;--warn:#F0B14A;--danger:#FF8A80;
  --c-school:#7C9BFF;--c-office:#3CCDB9;--c-apps:#FF7A6E;--c-games:#B28CFF;--c-services:#F0B14A;
  --blob1:rgba(255,199,44,.20);--blob2:rgba(60,90,255,.38);--blob3:rgba(255,59,78,.22);--scrim:rgba(0,0,0,.55);
  color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
html[lang="fr"] h1,html[lang="fr"] h2{letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin-inline:auto}
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.ambient i{position:absolute;border-radius:50%;filter:blur(70px)}
.ambient .b1{width:48vmax;height:48vmax;inset-block-start:-14vmax;inset-inline-start:-12vmax;background:var(--blob1)}
.ambient .b2{width:56vmax;height:56vmax;inset-block-start:22vh;inset-inline-end:-22vmax;background:var(--blob2)}
.ambient .b3{width:40vmax;height:40vmax;inset-block-end:-16vmax;inset-inline-start:6vmax;background:var(--blob3)}
.glass{background:linear-gradient(135deg,var(--spec-a),transparent 38%,transparent 72%,var(--spec-b)),var(--glass);
  -webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);
  border:1px solid var(--edge-lo);box-shadow:var(--shadow),inset 0 1px 0 var(--edge),inset 0 -1px 0 rgba(255,255,255,.06)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--glass-hi)}}
/* nav */
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:40;margin-block:10px 0;border-radius:24px;display:flex;align-items:center;gap:6px;padding:8px 10px}
.nav .sp{flex:1}
.nl{display:flex;gap:2px}
.nl a{text-decoration:none;padding:8px 14px;border-radius:14px;font-weight:500;color:var(--muted)}
.nl a:hover{color:var(--ink)}
.nl a[aria-current="page"]{color:var(--ink);background:var(--field);box-shadow:inset 0 1px 0 var(--edge)}
.ib{position:relative;min-width:44px;height:44px;border-radius:16px;border:1px solid transparent;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-weight:500}
.ib:hover{background:var(--field)}
.cbadge{position:absolute;inset-block-start:2px;inset-inline-end:2px;min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.cbadge[hidden]{display:none}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.logo .mark{width:40px;height:40px;border-radius:30%;display:grid;place-items:center;flex:none;overflow:hidden;
  background:linear-gradient(150deg,#FFE382,#FFB400);color:#0B1426;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -2px 4px rgba(150,90,0,.25),0 6px 16px -6px rgba(255,160,0,.7)}
.logo .mark svg{width:60%;height:60%}
.logo .mark img{width:100%;height:100%;object-fit:contain;background:#fff}
.logo .lt{display:grid;line-height:1.05}
.logo .lt small{font-size:12px;color:var(--muted);font-weight:500}
.logo .lt b{font:700 20px/1.1 var(--font-display)}
.logo.big .mark{width:68px;height:68px}
.logo.big .lt small{font-size:15px}
.logo.big .lt b{font-size:34px}
/* buttons */
.btn{min-height:48px;padding:0 22px;border-radius:999px;border:1px solid var(--edge-lo);background:var(--field);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);box-shadow:inset 0 1px 0 var(--edge);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#FFD65A,#FFBE0B);border-color:rgba(160,100,0,.35);color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 8px 20px -8px rgba(255,170,0,.8)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.ghost{background:transparent;box-shadow:none}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
/* hero */
.hero{position:relative;isolation:isolate;margin-block:18px 8px}
.hero-bg{position:absolute;inset:-30px -14px auto;height:100%;min-height:380px;background-size:cover;background-position:center;filter:blur(40px) saturate(1.5);opacity:.75;z-index:-1;border-radius:48px}
.hero-panel{border-radius:36px;padding:clamp(20px,4vw,40px);display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center}
.hero-copy{display:grid;gap:18px;justify-items:start}
.hero h1{font-size:clamp(30px,5.6vw,56px);line-height:1.18;font-weight:600}
.hero p{margin:0;color:var(--muted);max-width:46ch;font-size:clamp(15px,2.2vw,18px)}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.shopcard{margin:0;position:relative;border-radius:28px;overflow:hidden;aspect-ratio:8/7;box-shadow:var(--shadow),0 0 0 1px var(--edge-lo),inset 0 0 0 1px var(--edge)}
.shopcard img{width:100%;height:100%;object-fit:cover;display:block}
.shopcard figcaption{position:absolute;inset-inline:12px;bottom:12px;border-radius:18px;padding:8px 14px;font-size:14px;font-weight:500}
@media (max-width:820px){.hero-panel{grid-template-columns:1fr}.shopcard{aspect-ratio:16/10}}
@media (prefers-reduced-motion:no-preference){
  .hero-panel{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
  .shopcard{animation:rise .9s .18s cubic-bezier(.2,.8,.2,1) both}
  .hero-bg{animation:glow 1.4s ease-out both}
  @keyframes rise{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes glow{from{opacity:0}to{opacity:.75}}}
/* sections */
.sec{margin-top:clamp(36px,6vw,64px)}
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}
.sh h2{font-size:clamp(22px,3.4vw,32px);font-weight:600}
.sh p{margin:2px 0 0;color:var(--muted)}
.sh a{color:var(--link);text-decoration:none;font-weight:600;white-space:nowrap}
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.bt{border-radius:26px;padding:18px;display:grid;gap:14px;align-content:space-between;min-height:150px;text-align:start;cursor:pointer;border:1px solid var(--edge-lo);color:var(--ink)}
.bt:nth-child(1),.bt:nth-child(2){grid-column:span 3;min-height:180px}
.bt:nth-child(n+3){grid-column:span 2}
.bt .gl{width:46px;height:46px;border-radius:30%;display:grid;place-items:center;color:var(--cat);background:color-mix(in srgb,var(--cat) 16%,transparent);box-shadow:inset 0 1px 0 var(--edge)}
.bt .gl svg{width:24px;height:24px}
.bt b{font:600 18px/1.3 var(--font-display);display:block}
.bt span{color:var(--muted);font-size:14px}
@media (max-width:640px){.bento{grid-template-columns:1fr 1fr}.bt:nth-child(n){grid-column:span 1;min-height:140px}.bt:nth-child(5){grid-column:span 2}}
.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 16px;margin-inline:-2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.pz{flex:none;width:clamp(180px,42vw,230px);scroll-snap-align:start;border-radius:26px;overflow:hidden;position:relative;border:0;padding:0;cursor:pointer;text-align:start;box-shadow:var(--shadow),0 0 0 1px var(--edge-lo);background:var(--glass-hi)}
.pz img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pz .in{position:absolute;inset-inline:8px;bottom:8px;border-radius:18px;padding:8px 12px;display:grid;gap:0;font-size:14px}
.pz .in b{font-weight:600;line-height:1.35}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:14px}
.pc{position:relative;border-radius:26px;overflow:hidden;min-width:0;display:flex;flex-direction:column}
.pc[data-off="1"]{opacity:.55}
.pcm{display:block;width:100%;text-align:start;background:none;border:0;padding:8px 8px 0;cursor:pointer}
.tile{aspect-ratio:1;border-radius:20px;display:grid;place-items:center;position:relative;overflow:hidden;
  background:color-mix(in srgb,var(--cat,var(--blue)) 14%,var(--glass-hi));color:var(--cat,var(--blue))}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile svg{width:44px;height:44px}
.tag{position:absolute;inset-block-start:8px;inset-inline-start:8px;border-radius:999px;font-size:12px;padding:1px 9px;color:var(--ink)}
.pi{display:grid;gap:4px;padding:10px 6px 14px;padding-inline-end:52px}
.pn{font-weight:500;line-height:1.4;min-height:2.8em}
.pp{font-weight:600}
.pp s{color:var(--muted);font-weight:400;font-size:13px;margin-inline-start:6px}
.pp small{font-weight:400;color:var(--muted)}
.addb{position:absolute;inset-inline-end:10px;bottom:10px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(160,100,0,.35);background:linear-gradient(180deg,#FFD65A,#FFBE0B);color:#0B1426;cursor:pointer;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 6px 14px -6px rgba(255,170,0,.9)}
.addb:active{transform:scale(.92)}
.empty{padding:48px 0;text-align:center;color:var(--muted);grid-column:1/-1}
.filters{border-radius:26px;padding:12px;display:grid;gap:10px;margin-bottom:16px}
.fr1{display:flex;gap:10px;flex-wrap:wrap}
.search{flex:1;min-width:180px}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--edge-lo);background:var(--field);cursor:pointer;white-space:nowrap;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.st{border-radius:26px;padding:20px;display:grid;gap:8px;align-content:start}
.st .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--yellow);color:#0B1426;font:700 16px var(--font-display)}
.st b{font:600 18px var(--font-display)}
.st p{margin:0;color:var(--muted)}
@media (max-width:720px){.steps{grid-template-columns:1fr}}
.visit{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;align-items:start}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gal figure{margin:0;position:relative;border-radius:24px;overflow:hidden;aspect-ratio:1;box-shadow:var(--shadow),0 0 0 1px var(--edge-lo)}
.gal figure:first-child{grid-column:1/-1;aspect-ratio:16/10}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal figcaption{position:absolute;inset-inline-start:10px;bottom:10px;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500}
.vi{border-radius:28px;padding:22px;display:grid;gap:16px;align-content:start}
.vi h3{font-size:22px;font-weight:600}
.vr{display:grid;gap:2px}
.vr .k{font-size:13px;color:var(--muted)}
.vr .v{font-weight:500;overflow-wrap:anywhere}
@media (max-width:820px){.visit{grid-template-columns:1fr}}
.foot{margin-top:48px;padding-block:20px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* tab bar (phones) */
.tabbar{position:fixed;inset-inline:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:45;max-width:440px;margin-inline:auto;border-radius:30px;padding:6px;display:none;gap:4px}
.tab{flex:1;position:relative;min-height:56px;border-radius:24px;border:0;background:transparent;display:grid;place-items:center;align-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);text-decoration:none;cursor:pointer}
.tab[aria-current="page"]{color:var(--ink);background:var(--field);box-shadow:inset 0 1px 0 var(--edge)}
.tab .cbadge{inset-block-start:4px;inset-inline-end:calc(50% - 22px)}
@media (max-width:760px){.tabbar{display:flex}.nl{display:none}.nav .logo .lt small{display:none}}
/* sheets */
.layer{position:fixed;inset:0;z-index:70;background:var(--scrim);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:32px 32px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start;background:linear-gradient(135deg,var(--spec-a),transparent 40%),var(--glass-hi);border:1px solid var(--edge-lo);box-shadow:var(--shadow),inset 0 1px 0 var(--edge)}
@media (min-width:760px){.layer{align-items:center}.sheet{border-radius:32px}}
.sheet h2{font-size:22px;font-weight:600}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pd{display:grid;gap:14px}
.pd .tile{max-width:340px;width:100%;margin-inline:auto;border-radius:26px}
.pd .tile svg{width:72px;height:72px}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding-block:12px;border-bottom:1px solid var(--edge-lo);align-items:center}
.line .n{font-weight:500;min-width:0}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--edge-lo);border-radius:999px;background:var(--field)}
.stepper button{width:40px;height:40px;border:0;background:none;cursor:pointer;font-size:18px;border-radius:50%}
.stepper span{min-width:28px;text-align:center}
.sum{display:grid;gap:4px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .tot{font:600 19px/1.4 var(--font-display);border-top:1px solid var(--edge-lo);padding-top:8px;margin-top:4px}
.field{display:grid;gap:4px}
.field label,.lbl{font-size:14px;color:var(--muted);font-weight:500}
.inp{width:100%;min-height:46px;border:1px solid var(--edge-lo);background:var(--field);border-radius:16px;padding:8px 14px;box-shadow:inset 0 1px 0 var(--edge)}
textarea.inp{min-height:78px;resize:vertical}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--edge-lo);background:var(--field);border-radius:18px;padding:12px 14px;cursor:pointer}
.opt input{margin-top:5px;accent-color:var(--blue)}
.opt[data-on="1"]{border-color:var(--ink)}
.opt small{display:block;color:var(--muted)}
.note{border:1px solid var(--edge-lo);border-inline-start:4px solid var(--yellow);background:var(--field);border-radius:16px;padding:10px 14px;font-size:14px}
.note.err{border-inline-start-color:var(--danger);color:var(--danger)}
.note.warn{border-inline-start-color:var(--warn)}
.msgbox{white-space:pre-wrap;background:var(--field);border:1px dashed var(--edge-lo);border-radius:16px;padding:12px 14px;font-size:14px;max-height:200px;overflow:auto}
.toast{position:fixed;inset-inline:0;bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:80;pointer-events:none}
.toast span{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
/* admin */
.pagehead{margin-block:26px 16px}
.pagehead h1{font-size:clamp(28px,5vw,44px);font-weight:600}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.tabs{display:flex;gap:8px;margin-block:12px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-block:12px}
.stat{border-radius:22px;padding:14px 16px;display:grid;gap:0}
.stat b{font:600 28px/1.2 var(--font-display)}
.stat span{color:var(--muted);font-size:14px}
@media (max-width:620px){.stats{grid-template-columns:1fr 1fr}}
.prow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:22px;margin-bottom:8px}
.prow .tile{border-radius:14px}
.prow .tile svg{width:26px;height:26px}
.prow .nm{min-width:0}
.prow .nm b{display:block;overflow:hidden;text-overflow:ellipsis}
.prow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.prow{grid-template-columns:48px 1fr}.prow .acts{grid-column:1/-1;justify-content:flex-start}}
.badge{display:inline-block;font-size:12px;border:1px solid var(--edge-lo);border-radius:999px;padding:0 8px;color:var(--muted)}
.badge.off{color:var(--danger);border-color:var(--danger)}
.uprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.thumb{width:64px;height:64px;border-radius:16px;object-fit:cover;border:1px solid var(--edge-lo)}
.savebar{position:fixed;inset-inline:0;bottom:0;z-index:75;background:var(--ink);color:var(--bg);padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.savebar .btn{border-color:transparent}

.wrap{max-width:1320px}

function resizeImg(f,max){return new Promise(function(ok,no){var img=new Image(),u=URL.createObjectURL(f);img.onload=function(){var k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.85).split(',')[1])};img.onerror=no;img.src=u})}

app.addEventListener('click',function(e){

  case 'clrVid':saveSet({vid:''},'أُزيل الفيديو');break;

/* ---------- notifications ---------- */
var pollT=null,baseTitle=document.title;
function stopPoll(){clearInterval(pollT);pollT=null}
function doPoll(){
 if(!has('orders'))return;
 api('/api/admin/poll').then(function(p){
  var P=S.poll;
  if(P.lastId!==null&&p.lastId>P.lastId){beep();toast('طلب جديد: '+(p.last?p.last.number+' · '+fmt(p.last.total):''));document.title='(•) '+baseTitle;try{if(window.Notification&&Notification.permission==='granted')new Notification('طلب جديد',{body:p.last.number+' - '+p.last.name})}catch(x){}if(S.page==='orders'||S.page==='dash')load()}
  else if(P.proofTs!==null&&p.proofTs>P.proofTs){toast('تم رفع إثبات دفع جديد');if(S.page==='orders')load()}
  if(P.newCount!==p.newCount){S.poll.newCount=p.newCount;var si=document.querySelector('.si[data-id="orders"]');if(si){var bd=si.querySelector('.cbadge');if(p.newCount){if(!bd){bd=document.createElement('span');bd.className='cbadge';si.appendChild(bd)}bd.textContent=p.newCount}else if(bd)bd.remove()}}
  S.poll.lastId=p.lastId;S.poll.proofTs=p.proofTs;
 }).catch(function(e){if(e.status===401)toLogin()});
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)document.title=baseTitle});
function start(){
 S.poll={lastId:null,proofTs:null,newCount:0};S.data={};
 drawShell();load();doPoll();stopPoll();pollT=setInterval(doPoll,15000);
 try{if(window.Notification&&Notification.permission==='default'&&has('orders')){var nb=document.createElement('button');}}catch(x){}
}
api('/api/me').then(function(me){S.me=me;S.page=firstPage();start()}).catch(function(){drawLogin()});
})();
