<style id="css">
/* Slimi Bookstore: editorial identity. Paper, ink navy, one gold rule. No glass, no gradients, no glow.
   Type: El Messiri (display) + IBM Plex Sans Arabic (text). Layout: hairlines, asymmetric grids, large type. */
:root{
  --paper:#FAF7EE;--surface:#FFFFFF;--ink:#0E2257;--ink-2:#1F4FD8;--muted:#515C7B;--rule:#E6E1D3;--rule-2:#D3CEBF;
  --gold:#FFD21F;--gold-ink:#7A5C00;--ok:#17794A;--warn:#8F5600;--danger:#B42318;--scrim:rgba(15,27,60,.55);
  --bg:var(--paper);--field:var(--surface);--edge:var(--rule);--edge-lo:var(--rule);--glass-hi:var(--surface);
  --link:var(--ink);--blue:var(--ink);--yellow:var(--gold);--red:var(--danger);--accent-ink:var(--ink);
  --c-school:var(--ink-2);--c-office:var(--ink-2);--c-apps:var(--ink-2);--c-games:var(--ink-2);--c-services:var(--ink-2);
  --font-display:'El Messiri','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0A1433;--surface:#0E2257;--ink:#EEF1F5;--ink-2:#AEC0F5;--muted:#9AA9BD;--rule:#1E2F6B;--rule-2:#2E4590;
  --gold:#FFD21F;--gold-ink:#FFE066;--ok:#4FC28A;--warn:#F0B14A;--danger:#FF8A80;--scrim:rgba(0,0,0,.65);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0A1433;--surface:#0E2257;--ink:#EEF1F5;--ink-2:#AEC0F5;--muted:#9AA9BD;--rule:#1E2F6B;--rule-2:#2E4590;
  --gold:#FFD21F;--gold-ink:#FFE066;--ok:#4FC28A;--warn:#F0B14A;--danger:#FF8A80;--scrim:rgba(0,0,0,.65);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.75 var(--font-body);
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:0 0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:60}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
::selection{background:var(--gold);color:#fff}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance}
html[lang="fr"] h1,html[lang="fr"] h2{letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin-inline:auto}
#nav{display:contents}
/* header */
.util{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding:9px 0;font-size:13px;color:var(--muted);border-bottom:1px solid var(--rule)}
.util a{color:var(--ink);text-decoration:none;font-weight:600}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:10px;padding:12px 0;background:var(--paper);border-bottom:1px solid var(--rule)}
.nav .sp{flex:1}
.nl{display:flex;gap:2px;margin-inline-start:18px}
.nl a{position:relative;text-decoration:none;padding:8px 11px;font-weight:500;font-size:14.5px;color:var(--muted);white-space:nowrap;transition:color .2s}
.nl a::after{content:"";position:absolute;inset-inline:11px;bottom:2px;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:center;transition:transform .25s}
.nl a:hover{color:var(--ink)}.nl a:hover::after,.nl a[aria-current="page"]::after{transform:scaleX(1)}
.nl a[aria-current="page"]{color:var(--ink)}
.nsearch{display:flex;align-items:center;border-bottom:1px solid var(--rule-2);min-width:0;transition:border-color .2s}
.nsearch:focus-within{border-color:var(--ink)}
.nsearch input{border:0;background:transparent;padding:8px 6px;width:170px;font-size:14px;outline:none;min-width:0;transition:width .3s}
.nsearch input:focus{width:230px}
.nsearch button{border:0;background:transparent;padding:8px 6px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.ib{position:relative;min-width:42px;height:42px;border-radius:4px;border:0;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-weight:500;font-size:14px;transition:background .2s}
.ib:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.ib.acc{text-decoration:none}.ib.acc .an{max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbadge{position:absolute;inset-block-start:3px;inset-inline-end:2px;min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--paper);font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.cbadge[hidden]{display:none}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.logo .mark{width:40px;height:40px;display:grid;place-items:center;flex:none;overflow:hidden;background:var(--ink);color:var(--paper);border-radius:4px}
.logo .mark svg{width:60%;height:60%}.logo .mark img{width:100%;height:100%;object-fit:contain;background:#fff}
.logo .lt{display:grid;line-height:1.05}.logo .lt small{font-size:12px;color:var(--muted)}.logo .lt b{font:700 20px/1.1 var(--font-display)}
.logo.brandimg img{height:50px;width:auto;max-width:170px;object-fit:contain;display:block}
.logo.brandimg.big img{height:96px;max-width:220px}
:root[data-theme="dark"] .logo.brandimg img{background:#fff;border-radius:6px;padding:3px 8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo.brandimg img{background:#fff;border-radius:6px;padding:3px 8px}}
/* buttons */
.btn{min-height:46px;padding:0 24px;border-radius:4px;border:1px solid var(--ink);background:transparent;cursor:pointer;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);transition:background .2s,color .2s,border-color .2s,transform .12s}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:var(--ink-2);border-color:var(--ink-2);color:#fff}
.btn.link{border:0;padding:0;min-height:0;background:none;color:var(--ink);text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:7px}
.btn.link:hover{background:none;color:var(--ink);text-decoration-thickness:3px}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.ghost{border-color:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger)}.btn.danger:hover{background:var(--danger);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.cta{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
/* hero */
.hero{position:relative;isolation:isolate;display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,6vw,88px);align-items:center;padding-block:clamp(36px,7vw,96px) clamp(36px,6vw,72px)}
.hero h1{font:700 clamp(42px,7.4vw,96px)/1.05 var(--font-display);letter-spacing:-.015em}
.hero p{margin:24px 0 0;max-width:44ch;color:var(--muted);font-size:clamp(16px,1.9vw,19px)}
.hero .cta{margin-top:32px}
.hero-f{margin:0;position:relative}
.hero-f::before{content:"";position:absolute;z-index:-1;inset-block-start:14px;inset-block-end:-14px;inset-inline-start:-14px;inset-inline-end:14px;border:1px solid var(--gold)}
.hero-f img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;border-radius:2px;background:color-mix(in srgb,var(--ink) 8%,var(--surface))}
.hero-f figcaption{margin-top:26px;padding-top:10px;border-top:1px solid var(--rule);font-size:13px;color:var(--muted)}
@media (max-width:820px){.hero{grid-template-columns:1fr}.hero-f img{aspect-ratio:4/3}.hero-f::before{inset-inline-start:-8px;inset-inline-end:8px;inset-block-start:8px;inset-block-end:-8px}}
@media (prefers-reduced-motion:no-preference){
  .hero h1,.hero p,.hero .cta{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
  .hero p{animation-delay:.12s}.hero .cta{animation-delay:.24s}
  .hero-f img{animation:reveal 1.1s .08s cubic-bezier(.2,.7,.2,1) both}
  #page>*{animation:pg .45s ease both}
  @keyframes up{from{opacity:0;transform:translateY(20px)}}
  @keyframes reveal{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
  @keyframes pg{from{opacity:0;transform:translateY(8px)}}}
/* trust: plain columns */
.trust{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--rule)}
.trust>div{padding:22px 24px;border-inline-start:1px solid var(--rule)}.trust>div:first-child{border-inline-start:0;padding-inline-start:0}
.trust .ti{display:none}.trust b{display:block;font:600 18px/1.3 var(--font-display)}.trust .s{color:var(--muted);font-size:14px}
@media (max-width:760px){.trust{grid-template-columns:1fr 1fr}.trust>div:nth-child(odd){border-inline-start:0;padding-inline-start:0}.trust>div:nth-child(n+3){border-top:1px solid var(--rule)}}
/* sections */
.sec{margin-top:clamp(56px,9vw,120px)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:28px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.sh h2{font:600 clamp(26px,3.6vw,42px)/1.2 var(--font-display)}
.sh p{margin:4px 0 0;color:var(--muted)}
.sh a{font-weight:600;white-space:nowrap;text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:6px}
/* services as an index */
.svcs{border-top:1px solid var(--ink)}
.svc{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:6px 28px;align-items:baseline;padding:28px 6px;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink);transition:background .25s,padding .25s}
.svc b{font:600 clamp(24px,3.2vw,40px)/1.2 var(--font-display)}
.svc .s{color:var(--muted)}
.svc .go{font-weight:600;white-space:nowrap}
.svc .go::after{content:"\2190";display:inline-block;margin-inline-start:10px;transition:transform .25s}
[dir=ltr] .svc .go::after{content:"\2192"}
.svc:hover{background:var(--surface);padding-inline:20px}
.svc:hover .go::after{transform:translateX(-8px)}[dir=ltr] .svc:hover .go::after{transform:translateX(8px)}
@media (max-width:720px){.svc{grid-template-columns:1fr auto;padding-block:22px}.svc .s{grid-column:1/-1;order:3}}
/* products */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:40px 22px}
#hgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
#hgrid .pc:first-child{grid-column:span 2;grid-row:span 2}#hgrid .pc:nth-child(n+6){display:none}
#hgrid .pc:first-child .tile{aspect-ratio:auto;height:100%;min-height:380px}
@media (max-width:900px){#hgrid{grid-template-columns:repeat(2,minmax(0,1fr))}#hgrid .pc:first-child .tile{min-height:0;height:auto;aspect-ratio:4/5}}
.pc{position:relative;min-width:0;display:flex;flex-direction:column}
.pc[data-off="1"]{opacity:.5}
.pcm{display:block;width:100%;text-align:start;background:none;border:0;padding:0;cursor:pointer;flex:1}
.tile{aspect-ratio:4/5;display:grid;place-items:center;position:relative;overflow:hidden;border-radius:2px;background:color-mix(in srgb,var(--ink) 6%,var(--surface));color:var(--ink-2)}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.pcm:hover .tile img{transform:scale(1.04)}
.tile svg{width:34%;height:34%;stroke-width:1.1;opacity:.5}
.tag{position:absolute;inset-block-start:10px;inset-inline-start:10px;font-size:12px;padding:1px 9px;background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:2px}
.pi{display:grid;gap:2px;padding:14px 48px 0 0}
[dir=rtl] .pi{padding:14px 0 0 48px}
.pn{font-weight:500;line-height:1.45}
.pp{font-weight:600}.pp s{color:var(--muted);font-weight:400;font-size:13px;margin-inline-start:8px}.pp small{font-weight:400;color:var(--muted)}
.addb{position:absolute;inset-inline-end:0;bottom:0;width:38px;height:38px;border-radius:4px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s}
.addb:hover{background:var(--ink);color:var(--paper)}
.empty{padding:56px 0;text-align:center;color:var(--muted);grid-column:1/-1}
.strip{display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 18px;scrollbar-width:thin}
.pz{flex:none;width:clamp(200px,40vw,260px);scroll-snap-align:start;border:0;padding:0;cursor:pointer;text-align:start;background:none}
.pz img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;border-radius:2px;transition:transform .5s}

.pz .in{position:static;display:grid;padding:12px 0 0;font-size:15px}.pz .in b{font-weight:500}
/* filters */
.filters{display:grid;gap:16px;margin-bottom:32px}
.fr1{display:flex;gap:14px;flex-wrap:wrap}.search{flex:1;min-width:200px}
.seg{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}

.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.oh .chip{min-height:0;border:1px solid var(--rule-2);border-radius:2px;padding:1px 10px;margin:0;font-size:12px;color:var(--ink)}

.steps{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink)}
.st{padding:28px 28px 8px;border-inline-start:1px solid var(--rule);display:grid;gap:10px;align-content:start}

.st .n{font:700 clamp(52px,6vw,84px)/1 var(--font-display);color:var(--gold);display:block}
.st .n svg{width:40px;height:40px}
.st b{font:600 21px var(--font-display)}.st p{margin:0;color:var(--muted)}
@media (max-width:720px){.steps{grid-template-columns:1fr}.st{border-inline-start:0;border-top:1px solid var(--rule);padding-inline:0}.st:first-child{border-top:0}}
/* visit */
.visit{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(24px,5vw,64px);align-items:start}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gal figure{margin:0;position:relative;overflow:hidden;aspect-ratio:1;border-radius:2px}
.gal figure:first-child{grid-column:1/-1;aspect-ratio:16/10}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal figcaption{position:absolute;inset-inline-start:0;bottom:0;background:var(--paper);color:var(--ink);padding:6px 14px;font-size:13px;font-weight:500}
.vi{display:grid;gap:0;align-content:start}
.vi h3{font:600 clamp(24px,3vw,32px) var(--font-display);padding-bottom:14px;border-bottom:1px solid var(--ink)}

.vr .k{font-size:13px;color:var(--muted)}.vr .v{font-weight:500;overflow-wrap:anywhere}

/* footer */
.ftr{margin-top:clamp(64px,10vw,140px);background:var(--ink);color:#E8ECF7;padding:clamp(32px,6vw,72px) clamp(20px,4vw,56px) 24px}
:root[data-theme="dark"] .ftr{background:#0E2257}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ftr{background:#0E2257}}
.fc{display:grid;grid-template-columns:1.4fr 1fr 1.2fr 1fr;gap:clamp(24px,4vw,56px)}
.fc h4{margin:0 0 14px;font:600 16px var(--font-display);color:#FFE066}
.fc a,.fc span{display:block;color:#E8ECF7;text-decoration:none;font-size:14.5px;padding:4px 0;opacity:.9;transition:color .2s,opacity .2s}
.fc a:hover{color:#FFE066;opacity:1}
.fb .logo.brandimg img{background:#fff;border-radius:6px;padding:4px 10px;height:56px}
.fb p{margin:18px 0 0;font:600 clamp(20px,2.4vw,28px)/1.35 var(--font-display);color:#fff;max-width:14ch}
.fl{margin-top:44px;padding-top:18px;border-top:1px solid rgba(255,255,255,.18);color:#AAB6D6;font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fll{display:flex;gap:18px;flex-wrap:wrap}.fll a{color:#AAB6D6;text-decoration:none}.fll a:hover{color:#FFE066}
@media (max-width:820px){.fc{grid-template-columns:1fr 1fr}}@media (max-width:480px){.fc{grid-template-columns:1fr}}
/* tab bar */
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:45;display:none;gap:0;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--rule)}
.tab{flex:1;position:relative;min-height:54px;border:0;background:transparent;display:grid;place-items:center;align-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);text-decoration:none;cursor:pointer}
.tab[aria-current="page"]{color:var(--ink)}

@media (max-width:760px){.tabbar{display:flex}.nl{display:none}body{padding-bottom:78px}.nav .logo .lt small{display:none}}

.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:24px 22px calc(26px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;align-content:start;background:var(--paper);border-top:2px solid var(--gold)}

@media (prefers-reduced-motion:no-preference){.sheet{animation:drawer .35s cubic-bezier(.2,.7,.2,1) both}@keyframes drawer{from{opacity:0;transform:translateY(24px)}}
  @media (min-width:760px){.sheet{animation-name:drawerx}@keyframes drawerx{from{opacity:0;transform:translateX(-36px)}}[dir=ltr] .sheet{animation-name:drawerxl}@keyframes drawerxl{from{opacity:0;transform:translateX(36px)}}}}
.sheet h2{font:600 26px var(--font-display)}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.pd{display:grid;gap:14px}.pd .tile{max-width:340px;width:100%;margin-inline:auto}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding-block:14px;border-bottom:1px solid var(--rule);align-items:center}
.line .n{font-weight:500;min-width:0}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--rule-2);border-radius:4px;background:var(--surface)}

.sum{display:grid;gap:6px}.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .tot{font:600 21px/1.4 var(--font-display);border-top:1px solid var(--ink);padding-top:10px;margin-top:6px}

function t(k){return TX[S.lang][k]||TX.ar[k]||k}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' '+t('da')}
function pname(p){return p.name[S.lang]||p.name.ar||p.name.fr||''}
function catOf(id){return CATS.filter(function(c){return c.id===id})[0]||CATS[0]}
function find(id,src){var a=(src||DATA).products;for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
function saveCart(){try{localStorage.setItem('slimi-cart',JSON.stringify(S.cart))}catch(e){}}
function toast(m){var el=document.getElementById('toast');if(el)el.innerHTML='<span>'+esc(m)+'</span>';clearTimeout(toast._t);toast._t=setTimeout(function(){var e=document.getElementById('toast');if(e)e.innerHTML=''},2200)}
function setDir(){var r=document.documentElement;r.lang=S.lang;r.dir=S.lang==='ar'?'rtl':'ltr'}
function nav(h){S.hv=h;try{if(location.hash.replace('#','')!==h)location.hash=h}catch(e){}S.route=routeNow();S.confirmDel=null;drawNav();drawPage();try{window.scrollTo(0,0)}catch(e){}}
function routeNow(){var h=(S.hv!=null?S.hv:location.hash.replace('#',''));if(h.indexOf('product/')===0){S.pid=h.slice(8);return 'product'}return(['shop','visit','track','subs','bills','offers','about','contact','login','account','terms','privacy','returns','faq'].indexOf(h)>-1)?h:'home'}
function cfg(){return DATA.settings}
function shown(){return DATA.products.filter(function(p){return p.avail})}
function cnt(c){return shown().filter(function(p){return p.cat===c}).length}

function logo(big){
 var s=cfg();

 return '<span class="logo'+(big?' big':'')+'"><span class="mark">'+mark+'</span><span class="lt"><small>'+esc(t('libr'))+'</small><b>'+esc(t('slimi'))+'</b></span></span>';
}
function tile(p){
 var c=catOf(p.cat);
 var inner=p.img?'<img src="'+esc(p.img)+'" alt="'+esc(pname(p))+'" loading="lazy" decoding="async">':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+GLYPH[p.cat]+'</svg>';
 return '<div class="tile" style="--cat:var(--c-'+esc(c.id)+')">'+inner+(p.type==='digital'?'<span class="tag glass">'+esc(t('digital'))+'</span>':'')+'</div>';
}
function priceHtml(p){
 if(!(p.price>0))return '<span class="pp"><small>'+esc(t('onreq'))+'</small></span>';
 return '<span class="pp num">'+esc(fmt(p.price))+(p.old>p.price?'<s>'+esc(fmt(p.old))+'</s>':'')+'</span>';
}
function card(p){
 return '<article class="pc glass"><button class="pcm" data-act="open" data-id="'+esc(p.id)+'">'+tile(p)+'<span class="pi"><span class="pn">'+esc(pname(p))+'</span>'+priceHtml(p)+'</span></button>'+

}

/* ---------- cart ---------- */
function totals(){
 var sub=0,phys=0,onreq=false,hasD=false,hasP=false,lines=[],pm=null;
 for(var id in S.cart){
  var p=find(id);if(!p||!p.avail)continue;var q=S.cart[id];if(!(q>0))continue;
  lines.push({p:p,q:q});
  if(p.pays&&p.pays.length)pm=pm?pm.filter(function(x){return p.pays.indexOf(x)>-1}):p.pays.slice();
  if(p.price>0){sub+=p.price*q;if(p.type==='physical')phys+=p.price*q}else onreq=true;
  if(p.type==='digital')hasD=true;else hasP=true;
 }
 var st=cfg(),fee=0,feeKnown=true;
 if(hasP&&S.form.delivery==='home'){
  if(st.freeFrom>0&&phys>=st.freeFrom)fee=0;
  else if(!S.form.wilaya)feeKnown=false;
  else fee=S.form.wilaya==='42'?st.feeLocal:st.feeOther;
 }
 return{pm:pm,sub:sub,phys:phys,onreq:onreq,hasD:hasD,hasP:hasP,lines:lines,fee:fee,feeKnown:feeKnown,total:sub+(feeKnown?fee:0)};
}

function api(u,o){o=o||{};var init={method:o.method||'GET',headers:{},credentials:'same-origin'};if(o.body){init.headers['Content-Type']='application/json';init.body=JSON.stringify(o.body)}return fetch(u,init).then(function(r){return r.json().then(function(j){if(!r.ok)throw j;return j},function(){throw{error:'bad'}})})}

function filePayload(f){return new Promise(function(ok,no){
 if(f.type==='application/pdf'){if(f.size>2.4e6)return no();var r=new FileReader();r.onload=function(){ok({mime:f.type,data:String(r.result).split(',')[1]})};r.onerror=no;r.readAsDataURL(f);return}
 var img=new Image(),u=URL.createObjectURL(f);img.onload=function(){var k=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok({mime:'image/jpeg',data:c.toDataURL('image/jpeg',.82).split(',')[1]})};img.onerror=no;img.src=u})}

}

  case 'zoom':var z=document.createElement('div');z.className='zoom';z.setAttribute('data-act','zoomx');z.setAttribute('role','dialog');z.setAttribute('aria-modal','true');z.innerHTML='<img src="'+esc(id)+'" alt=""><button type="button" data-act="zoomx" aria-label="'+esc(t('close'))+'">&times;</button>';app.appendChild(z);var zb=z.querySelector('button');if(zb)zb.focus();break;
  case 'zoomx':var zz=document.querySelector('.zoom');if(zz)zz.remove();break;
  case 'add':var aq=b.dataset.q?(+(document.getElementById('pq')||{}).textContent||1):1;S.cart[id]=(S.cart[id]||0)+aq;saveCart();drawBadge();toast(t('added'));break;
  case 'addClose':S.cart[id]=(S.cart[id]||0)+1;saveCart();drawBadge();S.sheet=null;drawLayer();toast(t('added'));break;
  case 'inc':S.cart[id]=(S.cart[id]||0)+1;saveCart();drawBadge();drawLayer();break;
  case 'dec':S.cart[id]=(S.cart[id]||0)-1;if(S.cart[id]<=0)delete S.cart[id];saveCart();drawBadge();drawLayer();break;
  case 'rm':delete S.cart[id];saveCart();drawBadge();drawLayer();break;
  case 'openCart':S.sheet='cart';drawLayer();break;
  case 'close':S.sheet=null;drawLayer();break;
  case 'checkout':S.sheet='checkout';S.err=[];drawLayer();break;
  case 'review':var T=totals();S.err=validate(T);if(S.err.length){drawLayer();break}
   b.disabled=true;
   api('/api/orders',{method:'POST',body:{items:T.lines.map(function(l){return{id:l.p.id,q:l.q}}),name:S.form.name,phone:S.form.phone,delivery:S.form.delivery,wilaya:S.form.wilaya,addr:S.form.addr,pay:S.form.pay,note:S.form.note,accountRef:S.form.ref,lang:S.lang}}).then(function(r){S.order=r;S.msg=buildMsg(T);S.cart={};saveCart();drawBadge();S.sheet='done';drawLayer();if(r.pay_method==='online')payNow(false)}).catch(function(){S.err=[t('err_net')];drawLayer()});break;
  case 'copy':
   try{navigator.clipboard.writeText(S.msg).then(function(){toast(t('copied'))},function(){toast(t('copyfail'))})}catch(x){toast(t('copyfail'))}
   break;
  case 'newOrder':S.cart={};saveCart();S.sheet=null;S.form.note='';drawBadge();drawLayer();break;
  case 'track':doTrack();break;
  case 'payNow':payNow(false);break;
  case 'trackPay':payNow(true);break;
  case 'goTrack':S.sheet=null;drawLayer();S.track={num:S.order?S.order.number:'',phone:S.form.phone};nav('track');break;
 }
});
app.addEventListener('input',function(e){
 var el=e.target;
 if(el.id==='q'){S.q=el.value;drawGrid();return}
 if(el.dataset.f&&el.type!=='radio'){S.form[el.dataset.f]=el.value;return}
});
app.addEventListener('change',function(e){
 var el=e.target;
 if(el.id==='sort'){S.sort=el.value;drawGrid();return}
 if(el.dataset.f==='wilaya'){S.form.wilaya=el.value;drawLayer();return}
 if(el.type==='radio'&&el.dataset.f){S.form[el.dataset.f]=el.value;drawLayer();return}
 if((el.id==='proof-file'||el.id==='t-proof')&&el.files&&el.files[0]){sendProof(el.id==='t-proof',el.files[0]);return}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='hq'){e.preventDefault();var hb=document.querySelector('[data-act=hsearch]');if(hb)hb.click();return}if(e.key==='Escape'&&S.sheet){S.sheet=null;drawLayer()}});
document.addEventListener('click',function(e){var a=e.target&&e.target.closest?e.target.closest('a[href^="#"]'):null;if(!a||a.target==='_blank'||e.defaultPrevented||e.metaKey||e.ctrlKey)return;var h=a.getAttribute('href').slice(1);if(h==='')return;e.preventDefault();nav(h)});
window.addEventListener('hashchange',function(){
 S.hv=null;S.route=routeNow();S.confirmDel=null;drawNav();drawPage();window.scrollTo(0,0);
});

try{var q=new URLSearchParams(location.search);if(q.get('paid')){S.track={num:q.get('paid'),phone:''};S.banner=t('paidBack')}else if(q.get('failed')){S.track={num:q.get('failed'),phone:''};S.banner=t('failBack')}}catch(e){}
S.route=routeNow();
function skel(){app.innerHTML='<div class="skw" aria-busy="true"><div class="skl skh"></div><div class="skl skb"></div><div class="skg"><i class="skl"></i><i class="skl"></i><i class="skl"></i><i class="skl"></i></div></div>'}
function boot(){S.fail=false;skel();load().then(function(){if(S.fail){app.innerHTML='<div class="state" role="alert">'+ic('refresh',40)+'<div><b>'+esc(t('loadFail'))+'</b>'+esc(t('loadFailS'))+'</div><button class="btn primary" id="retry">'+esc(t('retry'))+'</button></div>';var r=document.getElementById('retry');if(r)r.addEventListener('click',boot);return}drawShell();api('/api/c/me').then(function(c){setCust(c);drawNav();if(S.route==='account'||S.route==='login')drawPage()}).catch(function(){})})}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){var zz=document.querySelector('.zoom');if(zz)zz.remove()}});
boot();
})();
